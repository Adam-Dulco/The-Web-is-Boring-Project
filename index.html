<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"
    ></script>

    <title>3D Testing</title>
  </head>

  <body>
    <main>
      <!--Change rotation-per-second="-30deg" to a higher value to increase speed-->
      <div class="center-vortex-container">
        <model-viewer
          camera-controls
          disable-zoom
          auto-rotate
          auto-rotate-delay="0"
          rotation-per-second="-30deg"
          shadow-intensity="1"
          exposure="1"
          environment-image="neutral"
          min-camera-orbit="0deg 0deg 1m"
          max-camera-orbit="360deg 0deg 1.7m"
          alt="Model"
          src="./spinning_vortex.glb"
          class="vortex_model"
        >
        </model-viewer>

        <!--OVERLAY COCKPIT-->
        <picture>
          <source
            srcset="./cockpit-interface-components/mobile-cockpit-interface.png"
            media="(max-width: 840px)"
          />
          <img
            src="./cockpit-interface-components/cockpit-interface.png"
            class="overlay-cockpit"
          />
        </picture>
        <!-- <img src="./cockpit-interface.png" alt="" class="overlay-cockpit" /> -->

        <div class="window-panel-container">
          <picture>
            <source
              srcset="
                ./cockpit-interface-components/window-interface-mobile.png
              "
              media="(max-width: 840px)"
            />
            <img
              src="./cockpit-interface-components/window-interface-desktop.png"
              alt=""
              class="window-interface"
            />
          </picture>
          <div class="window-text" id="windowText">
            <p class="first-line">
              Welcome on board the Edge Hill X530 Time Machine
            </p>
            <p>Please select your destination from the control panel.</p>
            <p>Fasten your seat belt and enjoy the ride...</p>
            <p>Initializing vortex system...</p>
            <p>Calibrating rotation...</p>
            <p>Connection established.</p>
          </div>
        </div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
